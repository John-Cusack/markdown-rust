# Release configuration for the `markdown` converted project.
#
# This file is the single source of truth for publishing the rustsmith output
# as a reusable Rust core crate (crates.io) plus a Python package calling that
# same core (PyPI). Field meanings are documented in `docs/RELEASE.md`.

[release]
schema = 1
# Original package identity.
project = "markdown"
# Rust core crate published to crates.io (`markdown-core/Cargo.toml [package] name`).
rust_crate = "markdown-rust-core"
# Python distribution published to PyPI (`pyproject.toml [project] name`).
# MUST differ from `project`: the original name stays with upstream.
pypi_dist = "markdown-rust"
# Python import name. MUST equal the package's import name: users swap the
# install with zero import changes (`pip install markdown-rust`
# still does `import markdown`).
python_import = "markdown"
# Release version. MUST equal `[package] version` in `Cargo.toml`,
# `markdown-core/Cargo.toml`, and `[project] version` in `pyproject.toml`.
# Snapshot of upstream 3.11.2 at port time.
version = "3.11.2"
# Supported Python versions (workflow matrix) and the matching floor.
requires_python = ">=3.11"
python_versions = ["3.11", "3.12", "3.13", "3.14"]
# GitHub runners the release workflow builds and tests on.
platforms = ["ubuntu-22.04", "macos-14", "windows-2022"]

# Publishing repository and workflow identity (trusted publishing, no tokens).
github_repo = "John-Cusack/markdown-rust"
release_workflow = ".github/workflows/release.yml"
pypi_environment = "pypi"
testpypi_environment = "testpypi"

# License and upstream attribution.
license_spdx = "BSD-3-Clause"
upstream = "Python-Markdown/markdown"
upstream_url = "https://github.com/Python-Markdown/markdown"
upstream_license = "BSD-3-Clause"
upstream_authors = "The Python Markdown Project"

# Smoke checks run against the installed wheel (Python expressions; each must
# evaluate truthy). Kept to stdlib-only, deterministic vectors.
smoke_exprs = [
  "markdown.markdown('# hi') == '<h1>hi</h1>'",
  "markdown.markdown('a *b* c', extensions=['extra']) == '<p>a <em>b</em> c</p>'",
  "len(markdown.__version__) > 0",
]
